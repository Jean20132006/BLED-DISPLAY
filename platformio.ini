; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; PlatformIO project for ELECROW CrowPanel ESP32 Advanced 7.0"
; SKU: DIS02170A v1.4  |  MCU: ESP32-S3-WROOM-1-N16R8 (16MB Flash / 8MB Octal PSRAM)
; Framework: ESP-IDF
; ============================================================================
[env:crowpanel_dis02170a]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = espidf

; ---- Serial ----
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; ---- Flash (N16R8 = 16MB flash) ----
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; ---- Build ----
build_flags =
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_MODE_OCT=1

; Most PSRAM / flash / partition options are actually driven by
; sdkconfig.defaults for the ESP-IDF framework. Run `pio run -t menuconfig`
; if you need to fine tune anything not covered here.

